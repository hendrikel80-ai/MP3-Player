name: APK bauen

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release erstellen mit dieser Version (z. B. v1.0.0) – leer lassen für nur bauen'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Signaturschlüssel aus Secrets laden (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MP3-Player-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Schach-APK hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Schach-APK
          path: chess/build/outputs/apk/release/*.apk

      - name: Release veröffentlichen (bei Tags v* oder manuell)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: MP3 Player ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            📱 **Schritt-für-Schritt-Anleitung:** https://github.com/${{ github.repository }}/blob/${{ github.sha }}/INSTALLATION.md

            **Kurz:** Die Datei `MP3-Player-release.apk` unten herunterladen, auf dem Handy antippen
            und „Installation aus unbekannten Quellen“ erlauben.

            Funktionen: Bibliothek nach Titel, Künstler, Album und Genre · Playlists aus Metadaten ·
            eigene Playlists · Metadaten (ID3-Tags) bearbeiten · Abspielgeschwindigkeit 0,25×–1× ·
            Hintergrund-Wiedergabe mit Steuerung in Benachrichtigung und Sperrbildschirm.

            ♞ **Neu: Schach-App** – `Schach-release.apk` genauso installieren: gegen den Computer (10 Stufen),
            zu zweit an einem Gerät oder online gegen echte Spieler über Lichess.
          files: |
            app/build/outputs/apk/release/*.apk
            chess/build/outputs/apk/release/*.apk
