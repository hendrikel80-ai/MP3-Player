name: APK bauen

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release erstellen mit dieser Version (z. B. v1.0.0) – leer lassen für nur bauen'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel aus Secrets laden (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Release veröffentlichen (bei Tags v* oder manuell)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: MP3 Player ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Installation:** Die Datei `MP3-Player-release.apk` unten herunterladen, auf dem Handy antippen
            und „Installation aus unbekannten Quellen“ erlauben.

            Funktionen: Bibliothek nach Titel, Künstler, Album und Genre · Playlists aus Metadaten ·
            eigene Playlists · Hintergrund-Wiedergabe mit Steuerung in Benachrichtigung und Sperrbildschirm.
          files: app/build/outputs/apk/release/*.apk
